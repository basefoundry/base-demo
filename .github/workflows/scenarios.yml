name: Isolated Base scenarios

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust:
    name: Trust and workspace scenarios (${{ matrix.lane }})
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable-v1.9
            base: ac8d294421e1bfc14afa8c6a2a12f1affb5268ee
            options: ""
          - lane: advisory-v1.10-candidate
            base: 06715fed19aceff27844aba546ba2a0b4c594ac7
            options: --candidate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base
          ref: ${{ matrix.base }}
          path: .dependencies/base
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: aa20cfe89bc3568ff19f8cc1414372feadb00fd4
          path: .dependencies/base-cli
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: 1333c0e7e4c3004663cda635e04965cb9d76511d
          path: .dependencies/base-bash-libs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixture interpreter dependencies
        # Match both exact Base revisions' lib/base/default_manifest.yaml.
        run: python -m pip install ./.dependencies/base-cli click==8.4.1 PyYAML==6.0.3 tomli==2.4.1
      - name: Install supported Bash for Base
        run: brew install bash
      - name: Verify isolated trust and consent contracts
        env:
          BASE_SCENARIO_COMMIT: ${{ matrix.base }}
          BASE_SCENARIO_OPTIONS: ${{ matrix.options }}
        run: |
          python tests/scenarios/trust.py \
            --base .dependencies/base --base-commit "$BASE_SCENARIO_COMMIT" \
            --base-cli .dependencies/base-cli --bash-libs .dependencies/base-bash-libs \
            --python "$(command -v python)" $BASE_SCENARIO_OPTIONS
      - name: Verify isolated workspace contracts
        env:
          BASE_SCENARIO_COMMIT: ${{ matrix.base }}
          BASE_SCENARIO_OPTIONS: ${{ matrix.options }}
        run: |
          python tests/scenarios/workspace.py \
            --base .dependencies/base --base-commit "$BASE_SCENARIO_COMMIT" \
            --base-cli .dependencies/base-cli --bash-libs .dependencies/base-bash-libs \
            --python "$(command -v python)" $BASE_SCENARIO_OPTIONS
      - name: Rehearse evaluator first success
        env:
          BASE_SCENARIO_COMMIT: ${{ matrix.base }}
          BASE_SCENARIO_OPTIONS: ${{ matrix.options }}
        run: |
          python tests/scenarios/journeys.py \
            --base .dependencies/base --base-commit "$BASE_SCENARIO_COMMIT" \
            --base-cli .dependencies/base-cli --bash-libs .dependencies/base-bash-libs \
            --python "$(command -v python)" $BASE_SCENARIO_OPTIONS
