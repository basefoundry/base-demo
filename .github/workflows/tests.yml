name: Validate Demo

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-demo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      BASE_CACHE_DIR: ${{ github.workspace }}/.base-cache
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash
      BASE_SETUP_NOTIFY: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_DEMO_ENV: baseline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: services/demo-console/package-lock.json

      - name: Install demo console dependencies
        working-directory: services/demo-console
        run: npm ci

      - name: Build and audit demo console
        working-directory: services/demo-console
        run: |
          npm run build
          npm run audit
          test -f dist/index.html
          find dist/assets -type f -name '*.js' -print -quit | grep -q .

      - name: Install Bash and BATS
        run: brew install bash bats-core

      - name: Validate repository baseline
        run: ./tests/validate.sh

      - name: Run demo script tests
        run: bats tests/demo_test.bats

      - name: Run installer tests
        run: bats tests/install_test.bats

      - name: Run representative environment tests
        run: >
          bats
          tests/services_test.bats
          tests/environments_test.bats
          tests/infra_test.bats
          tests/go_api_test.bats
          tests/python_api_test.bats
          tests/java_services_test.bats
          tests/native_services_test.bats
          tests/demo_console_test.bats

      # Pin the published Base v1.8.0 release used by the coordinated
      # base-bash-libs v2.0.0 cutover.
      - name: Check out Base
        run: |
          git init ../base
          git -C ../base remote add origin https://github.com/basefoundry/base.git
          git -C ../base fetch --depth 1 origin 26b9af5dee16efcb47e652513ce734b3ae9bc920
          git -C ../base checkout --detach FETCH_HEAD

      - name: Verify onboarding continues after Doctor findings
        run: >
          bats
          --filter 'basectl onboard continues to projects and trust when doctor reports findings'
          ../base/cli/bash/commands/basectl/tests/onboard.bats

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: basefoundry/base-bash-libs
          ref: b4243765726c133499feeabdc50154f99c0fec12
          path: .dependencies/base-bash-libs

      - name: Set up Base
        run: ../base/bin/basectl setup base --no-notify

      - name: Disable IDE setup in CI
        run: |
          mkdir -p ~/.base.d
          {
            printf '\nide:\n'
            printf '  enabled: false\n'
          } >> ~/.base.d/config.yaml

      - name: Preview base-demo onboarding
        run: |
          ../base/bin/basectl onboard base-demo --dry-run | tee /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl check base-demo' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl setup base-demo --dry-run' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq 'Projects' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl projects list' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq 'Trust' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl trust status' /tmp/base-demo-onboard-dry-run.txt

      - name: Run base-demo Python CLI tests
        run: >
          PYTHONPATH="../base/lib/python:../base/cli/python:lib/python"
          ~/.base.d/base/.venv/bin/python
          -m unittest
          lib.python.base_demo_cli.tests.test_cli

      - name: Set up base-demo
        run: ../base/bin/basectl setup base-demo --manifest ./base_manifest.yaml --no-notify

      - name: Ensure base-demo uv environment exists
        run: uv sync --locked

      - name: Check base-demo
        run: ../base/bin/basectl check base-demo --manifest ./base_manifest.yaml

      - name: Doctor base-demo
        run: ../base/bin/basectl doctor base-demo --manifest ./base_manifest.yaml

      - name: Show Base-generated environment reports
        run: |
          ../base/bin/basectl devcontainer base-demo --workspace .. --format json | tee /tmp/base-demo-devcontainer.json
          jq -e '.project == "base-demo" and .write == false and (.supported | index("ide.vscode.extensions"))' /tmp/base-demo-devcontainer.json
          ../base/bin/basectl devenv-report base-demo --workspace .. --format json | tee /tmp/base-demo-devenv-report.json
          jq -e '.project == "base-demo" and .target == "nix/devenv" and .summary.supported >= 1' /tmp/base-demo-devenv-report.json

      - name: Show workspace onboarding and agent brief
        run: |
          ../base/bin/basectl workspace onboarding --workspace .. --manifest ./workspace.yaml.example --format json | tee /tmp/base-demo-workspace-onboarding.json
          jq -e '.workspace_manifest.name == "base-demo-reference" and any(.repositories[]; .repository == "base-demo" and (.status == "ready" or .status == "needs_setup"))' /tmp/base-demo-workspace-onboarding.json
          ../base/bin/basectl workspace agent-brief --workspace .. --manifest ./workspace.yaml.example --format json | tee /tmp/base-demo-workspace-agent-brief.json
          jq -e '.workspace_manifest.name == "base-demo-reference" and any(.repositories[]; .repository == "base-demo" and (.handoff_status == "ready" or .handoff_status == "needs_setup"))' /tmp/base-demo-workspace-agent-brief.json

      - name: Check repository baseline through Base
        run: ../base/bin/basectl repo check .

      - name: Preview agent-ready repository guidance through Base
        run: ../base/bin/basectl repo init base-demo --path . --agent-ready --no-configure --dry-run

      - name: Check agent-ready repository guidance through Base
        run: ../base/bin/basectl repo check . --agent-ready

      - name: Review base-demo manifest commands
        run: |
          ../base/bin/basectl run base-demo --workspace .. --list
          ../base/bin/basectl build base-demo --workspace .. --list
          ../base/bin/basectl test base-demo --workspace .. --dry-run

      - name: Trust base-demo manifest commands
        run: ../base/bin/basectl trust allow base-demo --workspace ..

      - name: Run base-demo hello command
        run: ../base/bin/basectl run base-demo --workspace .. hello

      - name: Run base-demo Python info command
        run: ../base/bin/basectl run base-demo --workspace .. python-info -- info

      - name: Run base-demo Python env command
        run: ../base/bin/basectl run base-demo --workspace .. python-info -- env

      - name: Show representative services
        run: ../base/bin/basectl run base-demo --workspace .. services -- status

      - name: Check representative services
        run: ../base/bin/basectl run base-demo --workspace .. services -- check

      - name: Validate representative environments
        run: ../base/bin/basectl run base-demo --workspace .. environments -- validate --all

      - name: Dry-run representative service startup
        env:
          BASE_DEMO_SERVICES_DRY_RUN: "1"
        run: ../base/bin/basectl run base-demo --workspace .. services -- start

      - name: Test base-demo
        run: ../base/bin/basectl test base-demo --workspace ..

      - name: Build base-demo
        run: ../base/bin/basectl build base-demo --workspace ..

      - name: Show Base docs URL
        run: ../base/bin/basectl docs --show-url

      - name: Run base-demo non-interactively
        run: ../base/bin/basectl demo base-demo --workspace .. -- --non-interactive

  validate-base-cli-source:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      BASE_CACHE_DIR: ${{ github.workspace }}/.base-cache
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash
      BASE_CLI_SOURCE_DIR: ${{ github.workspace }}/../base-cli/lib/python
      BASE_SETUP_NOTIFY: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_DEMO_ENV: baseline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Bash and BATS
        run: brew install bash bats-core

      # Pin the published Base v1.8.0 release, which includes the extracted
      # provider contract used by this source-compatibility job.
      - name: Check out Base source-provider compatibility revision
        run: |
          git init ../base
          git -C ../base remote add origin https://github.com/basefoundry/base.git
          git -C ../base fetch --depth 1 origin 26b9af5dee16efcb47e652513ce734b3ae9bc920
          git -C ../base checkout --detach FETCH_HEAD

      - name: Check out base-cli source
        run: |
          git clone --depth 1 --branch v0.4.2 https://github.com/basefoundry/base-cli.git ../base-cli
          test -f "$BASE_CLI_SOURCE_DIR/base_cli/__init__.py"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: basefoundry/base-bash-libs
          ref: b4243765726c133499feeabdc50154f99c0fec12
          path: .dependencies/base-bash-libs

      - name: Set up Base with the source provider
        run: ../base/bin/basectl setup base --no-notify

      - name: Set up base-demo
        run: ../base/bin/basectl setup base-demo --manifest ./base_manifest.yaml --no-notify

      - name: Ensure base-demo uv environment exists
        run: uv sync --locked

      - name: Trust base-demo manifest
        run: ../base/bin/basectl trust allow base-demo --workspace ..

      - name: Verify the explicit source provider
        run: |
          output="$(../base/bin/basectl run base-demo --workspace .. python-info -- env)"
          printf '%s\n' "$output"
          grep -Fq 'BASE_CLI_SOURCE=explicit' <<<"$output"

      - name: Run base-demo Python CLI tests against source
        run: >
          PYTHONPATH="$BASE_CLI_SOURCE_DIR:../base/lib/python:../base/cli/python:lib/python"
          ~/.base.d/base/.venv/bin/python
          -m unittest
          lib.python.base_demo_cli.tests.test_cli

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Bandit
        run: |
          uv run --no-project --with bandit==1.9.4 \
            bandit -q -r bin lib -x '*/tests/*' --severity-level medium

      - name: Run pip-audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            | uv run --no-project --with pip-audit==2.10.1 \
                pip-audit --cache-dir "$RUNNER_TEMP/pip-audit" -r /dev/stdin

      - name: Run ShellCheck
        run: |
          git ls-files -z '*.sh' 'bin/base-demo-python-info' \
            | xargs -0 shellcheck --severity=error

  validate-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_CACHE_DIR: ${{ github.workspace }}/.base-cache
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash
      BASE_DEMO_ENV: baseline
      BASE_SETUP_NOTIFY: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: services/demo-console/package-lock.json

      - name: Install demo console dependencies
        working-directory: services/demo-console
        run: npm ci

      - name: Build and audit demo console
        working-directory: services/demo-console
        run: |
          npm run build
          npm run audit
          test -f dist/index.html
          find dist/assets -type f -name '*.js' -print -quit | grep -q .

      - name: Install Ubuntu prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip jq

      - name: Check out Base
        run: |
          git init ../base
          git -C ../base remote add origin https://github.com/basefoundry/base.git
          git -C ../base fetch --depth 1 origin 26b9af5dee16efcb47e652513ce734b3ae9bc920
          git -C ../base checkout --detach FETCH_HEAD

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: basefoundry/base-bash-libs
          ref: b4243765726c133499feeabdc50154f99c0fec12
          path: .dependencies/base-bash-libs

      - name: Set up Base on Ubuntu
        run: ../base/bin/basectl setup base --yes --no-notify

      - name: Preview base-demo onboarding
        run: |
          ../base/bin/basectl onboard base-demo --dry-run | tee /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl check base-demo' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl setup base-demo --dry-run' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq 'Projects' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl projects list' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq 'Trust' /tmp/base-demo-onboard-dry-run.txt
          grep -Fq '[DRY-RUN] Would run basectl trust status' /tmp/base-demo-onboard-dry-run.txt

      - name: Validate Ubuntu dev profile setup
        run: |
          ../base/bin/basectl setup base --profile dev --yes --no-notify
          bats --version
          gh --version
          shellcheck --version

      - name: Verify onboarding continues after Doctor findings
        run: >
          bats
          --filter 'basectl onboard continues to projects and trust when doctor reports findings'
          ../base/cli/bash/commands/basectl/tests/onboard.bats

      - name: Check base-demo in CI mode
        run: ../base/bin/basectl check --ci base-demo --manifest ./base_manifest.yaml --format json | tee /tmp/base-demo-ci.json

      - name: Verify CI JSON status
        run: jq -e '.status' /tmp/base-demo-ci.json

      - name: Show Base-generated environment reports
        run: |
          ../base/bin/basectl devcontainer base-demo --workspace .. --format json | tee /tmp/base-demo-devcontainer.json
          jq -e '.project == "base-demo" and .write == false and (.supported | index("ide.vscode.extensions"))' /tmp/base-demo-devcontainer.json
          ../base/bin/basectl devenv-report base-demo --workspace .. --format json | tee /tmp/base-demo-devenv-report.json
          jq -e '.project == "base-demo" and .target == "nix/devenv" and .summary.supported >= 1' /tmp/base-demo-devenv-report.json

      - name: Show workspace onboarding and agent brief
        run: |
          ../base/bin/basectl workspace onboarding --workspace .. --manifest ./workspace.yaml.example --format json | tee /tmp/base-demo-workspace-onboarding.json
          jq -e '.workspace_manifest.name == "base-demo-reference" and any(.repositories[]; .repository == "base-demo" and (.status == "ready" or .status == "needs_setup"))' /tmp/base-demo-workspace-onboarding.json
          ../base/bin/basectl workspace agent-brief --workspace .. --manifest ./workspace.yaml.example --format json | tee /tmp/base-demo-workspace-agent-brief.json
          jq -e '.workspace_manifest.name == "base-demo-reference" and any(.repositories[]; .repository == "base-demo" and (.handoff_status == "ready" or .handoff_status == "needs_setup"))' /tmp/base-demo-workspace-agent-brief.json
