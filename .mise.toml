[settings]
python.github_attestations = false

[tools]
node = "22.22.0"
python = "3.13"

[tasks.frontend-install]
description = "Install locked demo-console frontend dependencies"
dir = "services/demo-console"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json", "node_modules/.bin/vite"]

[tasks.validate]
description = "Run the repository baseline validation"
depends = ["frontend-install"]
run = "./tests/validate.sh"
